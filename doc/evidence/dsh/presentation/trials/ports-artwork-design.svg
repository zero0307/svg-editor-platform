<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">交叉注意力</title>
  <desc id="fig-desc">解码器状态输出查询 Q；编码器记忆通过同一主干分叉为键 K 与值 V；交叉注意力融合三者，输出上下文表示。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F2"/>
      <stop offset="0.55" stop-color="#F7F3EB"/>
      <stop offset="1" stop-color="#F1EBE0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142D42"/>
      <stop offset="0.58" stop-color="#102538"/>
      <stop offset="1" stop-color="#0B1C2B"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C88B28"/>
      <stop offset="1" stop-color="#F6CE7E"/>
    </linearGradient>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="0.9" fill="#BFB5A6"/>
    </pattern>
    <pattern id="coreGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#8AD8CD" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#26323D" flood-opacity="0.09"/>
    </filter>
    <filter id="coreShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0A1621" flood-opacity="0.24"/>
    </filter>
    <clipPath id="coreClip">
      <rect x="490" y="238" width="338" height="356" rx="22"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: "SFMono-Regular", "Cascadia Code", "Menlo", "Consolas", monospace; }
    .tag { font-size: 9.5px; font-weight: 700; letter-spacing: 1.5px; }
    .card-title { font-size: 21px; font-weight: 700; letter-spacing: 0.2px; }
    .card-sub { font-size: 9px; font-weight: 600; letter-spacing: 1.15px; }
    .caption { font-size: 12.5px; font-weight: 400; }
  </style>

  <g id="background">
    <rect width="1280" height="720" fill="url(#bg)"/>
    <rect width="1280" height="720" fill="url(#dotgrid)" opacity="0.3"/>
    <g fill="none" stroke="#D6CCBD" opacity="0.55">
      <circle cx="1152" cy="86" r="82"/>
      <circle cx="1152" cy="86" r="116" opacity="0.55"/>
      <circle cx="1152" cy="86" r="150" opacity="0.28"/>
    </g>
    <path d="M1100 86H1204" stroke="#D6CCBD" stroke-width="1" opacity="0.8"/>
    <circle cx="1152" cy="86" r="4" fill="#D6CCBD"/>
  </g>

  <g id="heading">
    <text x="72" y="72" class="tag" fill="#C84831">TRANSFORMER · 注意力机制</text>
    <text x="72" y="129" font-size="48" font-weight="700" letter-spacing="1" fill="#17263A">交叉注意力</text>
    <rect x="72" y="146" width="46" height="4" rx="2" fill="#D94A33"/>
    <text x="72" y="178" font-size="16" fill="#5F6B78">解码器以查询检索编码器记忆，聚合出下一步所需的上下文。</text>
    <g id="figure-meta" text-anchor="end">
      <text x="1208" y="70" class="tag" fill="#7A7265">FIG. 01</text>
      <text x="1208" y="90" class="mono" font-size="9" letter-spacing="1.4" fill="#8D8578">SCALED DOT-PRODUCT</text>
    </g>
  </g>

  <g id="cards">
    <g id="card-decoder-state">
      <rect x="72" y="250" width="278" height="148" rx="20" fill="#FFFFFF" stroke="#E6DED1" filter="url(#cardShadow)"/>
      <rect x="96" y="265" width="22" height="3" rx="1.5" fill="#D94A33"/>
      <text x="96" y="287" class="tag" fill="#C84831">01 · QUERY SOURCE</text>
      <g id="icon-decoder">
        <rect x="96" y="299" width="44" height="44" rx="12" fill="#FCEFE9" stroke="#F4D8CE"/>
        <rect x="106" y="308" width="24" height="17" rx="4" fill="none" stroke="#D94A33" stroke-width="1.8"/>
        <path d="M111 314h13M111 319h8" fill="none" stroke="#D94A33" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M114 331h8" fill="none" stroke="#D94A33" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <text x="154" y="319" class="card-title" fill="#17263A">解码器状态</text>
      <text x="154" y="339" class="card-sub" fill="#8A8174">DECODER STATE</text>
      <text x="96" y="379" class="caption" fill="#5F6B78">上一步隐藏状态 hₜ₋₁</text>
    </g>

    <g id="card-encoder-memory">
      <rect x="72" y="446" width="278" height="148" rx="20" fill="#FFFFFF" stroke="#E6DED1" filter="url(#cardShadow)"/>
      <rect x="96" y="461" width="22" height="3" rx="1.5" fill="#0F766E"/>
      <text x="96" y="483" class="tag" fill="#0E7169">02 · KEY / VALUE SOURCE</text>
      <g id="icon-encoder">
        <rect x="96" y="495" width="44" height="44" rx="12" fill="#E9F6F2" stroke="#CDE9E1"/>
        <ellipse cx="118" cy="506" rx="11" ry="4.5" fill="none" stroke="#0F766E" stroke-width="1.7"/>
        <path d="M107 506v14c0 2.5 4.9 4.5 11 4.5s11-2 11-4.5v-14M107 513c0 2.5 4.9 4.5 11 4.5s11-2 11-4.5" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round"/>
      </g>
      <text x="154" y="515" class="card-title" fill="#17263A">编码器记忆</text>
      <text x="154" y="535" class="card-sub" fill="#8A8174">ENCODER MEMORY</text>
      <text x="96" y="575" class="caption" fill="#5F6B78">全部编码器位置输出 h₁ … hₙ</text>
    </g>

    <g id="card-cross-attention">
      <rect x="490" y="238" width="338" height="356" rx="22" fill="url(#core)" stroke="#2C465A" filter="url(#coreShadow)"/>
      <g clip-path="url(#coreClip)">
        <rect x="490" y="238" width="338" height="356" fill="url(#coreGrid)"/>
        <circle cx="788" cy="252" r="132" fill="#3FA99D" opacity="0.10"/>
        <circle cx="540" cy="590" r="150" fill="#D97B5E" opacity="0.06"/>
        <path d="M806 238L490 554" stroke="#7DD3C7" stroke-width="1" opacity="0.12"/>
      </g>
      <rect x="510" y="249" width="298" height="334" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.07"/>
      <rect x="520" y="254" width="22" height="3" rx="1.5" fill="#5EEAD4"/>
      <text x="520" y="274" class="tag" fill="#71D5C8">03 · ATTENTION CORE</text>
      <text x="520" y="307" font-size="26" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">交叉注意力</text>
      <text x="520" y="329" font-size="11.5" fill="#A8BBCC">查询与记忆在同一个语义空间中对齐</text>
      <g id="cross-attention-glyph" transform="translate(764 262)">
        <path d="M0 10H14M14 10L22 3M14 10L22 17" fill="none" stroke="#4A6A80" stroke-width="1.2"/>
        <circle cx="0" cy="10" r="2.6" fill="#FF8A70"/>
        <circle cx="14" cy="10" r="3" fill="#F4C76B"/>
        <circle cx="22" cy="3" r="2.5" fill="#5EEAD4"/>
        <circle cx="22" cy="17" r="2.5" fill="#5EEAD4"/>
      </g>
      <line x1="520" y1="344" x2="798" y2="344" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>

      <g id="attention-map">
        <text x="520" y="369" class="mono" font-size="8.5" letter-spacing="1.5" fill="#8FA7B9">ATTENTION MAP</text>
        <g>
          <rect x="520" y="380" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.18"/>
          <rect x="544" y="380" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.30"/>
          <rect x="568" y="380" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.68"/>
          <rect x="592" y="380" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.22"/>
          <rect x="520" y="401" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.52"/>
          <rect x="544" y="401" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.12"/>
          <rect x="568" y="401" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.26"/>
          <rect x="592" y="401" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.34"/>
          <rect x="520" y="422" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.18"/>
          <rect x="544" y="422" width="19" height="16" rx="4" fill="#FF8A70" opacity="0.92"/>
          <rect x="568" y="422" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.14"/>
          <rect x="592" y="422" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.26"/>
          <rect x="520" y="443" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.30"/>
          <rect x="544" y="443" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.16"/>
          <rect x="568" y="443" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.46"/>
          <rect x="592" y="443" width="19" height="16" rx="4" fill="#2DD4BF" opacity="0.18"/>
        </g>
        <path d="M611 419.5H647" fill="none" stroke="#6E8AA0" stroke-width="1.2"/>
    <path d="M647 415.5L655 419.5L647 423.5Z" fill="#6E8AA0"/>
        <text x="624" y="411" class="mono" font-size="8.5" fill="#7DD3C7">α</text>
      </g>

      <g id="aggregation">
        <text x="662" y="370" class="mono" font-size="8.5" letter-spacing="1.2" fill="#F4C76B">Σ αV</text>
        <rect x="662" y="380" width="118" height="79" rx="14" fill="#10293D" stroke="#2B4659"/>
        <rect x="680" y="428" width="10" height="18" rx="3" fill="url(#barGold)" opacity="0.55"/>
        <rect x="698" y="416" width="10" height="30" rx="3" fill="url(#barGold)" opacity="0.68"/>
        <rect x="716" y="402" width="10" height="44" rx="3" fill="url(#barGold)"/>
        <rect x="734" y="422" width="10" height="24" rx="3" fill="url(#barGold)" opacity="0.62"/>
        <rect x="752" y="412" width="10" height="34" rx="3" fill="url(#barGold)" opacity="0.80"/>
        <text x="721" y="399" text-anchor="middle" font-size="9" letter-spacing="1" fill="#8BA2B5">CONTEXT</text>
      </g>

      <text x="520" y="481" class="mono" font-size="9.5" letter-spacing="0.8" fill="#8FA7B9">Q · Kᵀ → softmax → Σ αV</text>
      <text x="520" y="519" font-size="12.5" fill="#C7D5E1">查询与每个键对齐，按权重聚合值，</text>
      <text x="520" y="540" font-size="12.5" fill="#C7D5E1">形成解码器可用的上下文。</text>
      <line x1="520" y1="564" x2="542" y2="564" stroke="#F4C76B" stroke-width="2" stroke-linecap="round"/>
      <text x="550" y="568" class="mono" font-size="8.5" letter-spacing="1.5" fill="#F4C76B">CONTEXT VECTOR</text>
    </g>

    <g id="card-context-representation">
      <rect x="932" y="336" width="276" height="176" rx="20" fill="#FFFFFF" stroke="#E6DED1" filter="url(#cardShadow)"/>
      <circle cx="1186" cy="430" r="54" fill="#FBF2DF" opacity="0.55"/>
      <rect x="956" y="351" width="22" height="3" rx="1.5" fill="#B7791F"/>
      <text x="956" y="373" class="tag" fill="#9A6718">04 · OUTPUT VECTOR</text>
      <g id="icon-context">
        <rect x="956" y="385" width="44" height="44" rx="12" fill="#FBF2DF" stroke="#EDDAB4"/>
        <path d="M978 394l11 5.5-11 5.5-11-5.5 11-5.5z" fill="none" stroke="#B7791F" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M967 407l11 5.5 11-5.5M967 413l11 5.5 11-5.5" fill="none" stroke="#B7791F" stroke-width="1.6" stroke-linejoin="round"/>
      </g>
      <text x="1014" y="409" class="card-title" fill="#17263A">上下文表示</text>
      <text x="1014" y="429" class="card-sub" fill="#8A8174">CONTEXT REPRESENTATION</text>
      <text x="956" y="474" class="caption" fill="#5F6B78">融合后的上下文向量</text>
      <g id="context-token">
        <rect x="1122" y="452" width="58" height="32" rx="10" fill="#FBF2DF" stroke="#EBD6A9"/>
        <text x="1151" y="473" text-anchor="middle" font-size="15" font-style="italic" font-weight="600" fill="#B7791F">cₜ</text>
      </g>
    </g>
  </g>

  <g id="flow-connectors" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 332C390 332 421 338 476 338" stroke="#D94A33" stroke-width="2.8"/>
    <path d="M350 520H425V424" stroke="#0F766E" stroke-width="2.8"/>
    <path d="M425 424H476" stroke="#0F766E" stroke-width="2.8"/>
    <path d="M425 486H476" stroke="#0F766E" stroke-width="2.8"/>
    <circle cx="425" cy="424" r="5.2" fill="#F7F3EB" stroke="#0F766E" stroke-width="2"/>
    <circle cx="425" cy="486" r="5.2" fill="#F7F3EB" stroke="#0F766E" stroke-width="2"/>
    <path d="M828 424H918" stroke="#B7791F" stroke-width="2.8"/>
  </g>
  <g id="arrowheads">
    <path d="M463 331.8L477.5 338L463 344.2L467.2 338Z" fill="#D94A33"/>
    <path d="M463 417.8L477.5 424L463 430.2L467.2 424Z" fill="#0F766E"/>
    <path d="M463 479.8L477.5 486L463 492.2L467.2 486Z" fill="#0F766E"/>
    <path d="M906 417.8L920.5 424L906 430.2L910.2 424Z" fill="#B7791F"/>
  </g>

  <g id="flow-labels">
    <g id="label-q">
      <rect x="394" y="304" width="73" height="23" rx="11.5" fill="#FFF8F4" stroke="#F1C9BD"/>
      <text x="430.5" y="320" text-anchor="middle" font-size="10.5" font-weight="700" fill="#C23F2A">Q · 查询</text>
    </g>
    <g id="label-k">
      <rect x="426" y="397" width="45" height="22" rx="11" fill="#F4FBF9" stroke="#BFE5DD"/>
      <text x="448.5" y="412.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0E7169">K · 键</text>
    </g>
    <g id="label-v">
      <rect x="426" y="459" width="45" height="22" rx="11" fill="#F4FBF9" stroke="#BFE5DD"/>
      <text x="448.5" y="474.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0E7169">V · 值</text>
    </g>
    <g id="label-output">
      <rect x="846" y="391" width="74" height="22" rx="11" fill="#FCF7EA" stroke="#EBD6A9"/>
      <text x="883" y="406.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#946214">输出 · cₜ</text>
    </g>
  </g>

  <g id="ports">
    <g id="port-decoder-out">
      <circle cx="350" cy="332" r="9" fill="#FFF9F6" stroke="#D94A33" stroke-width="2.2"/>
      <circle cx="350" cy="332" r="3.1" fill="#D94A33"/>
    </g>
    <g id="port-memory-out">
      <circle cx="350" cy="520" r="9" fill="#F7FDFB" stroke="#0F766E" stroke-width="2.2"/>
      <circle cx="350" cy="520" r="3.1" fill="#0F766E"/>
    </g>
    <g id="port-attention-q">
      <circle cx="490" cy="338" r="9" fill="#0E2233" stroke="#FF8A70" stroke-width="2.4"/>
      <circle cx="490" cy="338" r="3.1" fill="#FF8A70"/>
    </g>
    <g id="port-attention-k">
      <circle cx="490" cy="424" r="9" fill="#0E2233" stroke="#5EEAD4" stroke-width="2.4"/>
      <circle cx="490" cy="424" r="3.1" fill="#5EEAD4"/>
    </g>
    <g id="port-attention-v">
      <circle cx="490" cy="486" r="9" fill="#0E2233" stroke="#99F6E4" stroke-width="2.4"/>
      <circle cx="490" cy="486" r="3.1" fill="#99F6E4"/>
    </g>
    <g id="port-attention-out">
      <circle cx="828" cy="424" r="9" fill="#0E2233" stroke="#F4C76B" stroke-width="2.4"/>
      <circle cx="828" cy="424" r="3.1" fill="#F4C76B"/>
    </g>
    <g id="port-context-in">
      <circle cx="932" cy="424" r="9" fill="#FFFDF8" stroke="#B7791F" stroke-width="2.2"/>
      <circle cx="932" cy="424" r="3.1" fill="#B7791F"/>
    </g>
  </g>

  <g id="footer">
    <line x1="72" y1="626" x2="1208" y2="626" stroke="#DCD3C5" stroke-width="1"/>
    <g id="footer-legend" transform="translate(72 650)">
      <circle cx="4" cy="-4" r="4" fill="#D94A33"/>
      <text x="16" y="0" font-size="11.5" fill="#5F6B78">Q 查询</text>
      <circle cx="88" cy="-4" r="4" fill="#0F766E"/>
      <text x="100" y="0" font-size="11.5" fill="#5F6B78">K 键</text>
      <circle cx="154" cy="-4" r="4" fill="#7DCBBF"/>
      <text x="166" y="0" font-size="11.5" fill="#5F6B78">V 值</text>
      <text x="236" y="0" font-size="11.5" fill="#8A8174">每个查询按相关性读取记忆</text>
    </g>
    <text x="1208" y="650" text-anchor="end" class="mono" font-size="9" letter-spacing="1.4" fill="#8D8578">CROSS-ATTENTION · 16 : 9</text>
  </g>
</svg>
