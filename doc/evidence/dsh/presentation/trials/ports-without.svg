<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">交叉注意力</title>
  <desc id="fig-desc">解码器状态为交叉注意力提供查询 Q；编码器记忆通过同一主干分叉出键 K 和值 V；交叉注意力的输出连接到上下文表示。</desc>

  <defs>
    <style><![CDATA[
      .cn { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Arial Unicode MS", sans-serif; }
      .latin { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
      .title { font-size: 56px; font-weight: 700; fill: #0E172A; letter-spacing: 3px; }
      .subtitle { font-size: 15.5px; font-weight: 500; fill: #6E7C95; letter-spacing: 2.4px; }
      .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 2.3px; }
      .box-title { font-size: 30px; font-weight: 700; }
      .box-sub { font-size: 13px; font-weight: 400; }
      .port-text { font-size: 13px; font-weight: 600; }
      .module-kicker { font-size: 11px; font-weight: 700; letter-spacing: 3.2px; fill: #8296C7; }
      .module-title { font-size: 36px; font-weight: 700; fill: #F7F9FF; letter-spacing: 2px; }
      .module-sub { font-size: 12.5px; font-weight: 500; fill: #9DAACB; letter-spacing: 1.2px; }
      .formula { font-family: Georgia, "Times New Roman", serif; font-size: 25px; font-style: italic; fill: #F1F5FF; letter-spacing: .4px; }
      .module-note { font-size: 12px; font-weight: 400; fill: #96A6C8; }
      .trunk-label { font-size: 11.5px; font-weight: 500; fill: #0F766E; letter-spacing: .5px; }
      .footer { font-size: 14px; font-weight: 400; fill: #697791; }
    ]]></style>

    <linearGradient id="pageWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFCFE"/>
      <stop offset="0.55" stop-color="#F6F8FC"/>
      <stop offset="1" stop-color="#F2F5FB"/>
    </linearGradient>

    <linearGradient id="topAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>

    <linearGradient id="titleRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="cardFill" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1B2741"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>

    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#8B9CD1" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.18"/>
    </linearGradient>

    <radialGradient id="dotFade" cx="50%" cy="43%" r="72%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.72" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </radialGradient>

    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#B8C4D8" opacity="0.55"/>
    </pattern>

    <mask id="dotMask">
      <rect width="1600" height="900" fill="url(#dotFade)"/>
    </mask>

    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#253764" flood-opacity="0.10"/>
    </filter>

    <filter id="cardShadow" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#101A31" flood-opacity="0.26"/>
    </filter>

  </defs>

  <!-- 背景 -->
  <rect width="1600" height="900" fill="url(#pageWash)"/>
  <g mask="url(#dotMask)">
    <rect width="1600" height="900" fill="url(#dotGrid)"/>
  </g>
  <rect x="0" y="0" width="1600" height="6" fill="url(#topAccent)"/>

  <!-- 标题 -->
  <g id="heading" class="cn">
    <text x="800" y="58" text-anchor="middle" class="latin eyebrow" fill="#7887A1">ATTENTION MECHANISM</text>
    <text x="800" y="112" text-anchor="middle" class="title">交叉注意力</text>
    <text x="800" y="147" text-anchor="middle" class="latin subtitle">DECODER–ENCODER CROSS-ATTENTION</text>
    <line x1="758" y1="173" x2="842" y2="173" stroke="url(#titleRule)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="744" cy="173" r="2.1" fill="#2563EB" opacity="0.7"/>
    <circle cx="856" cy="173" r="2.1" fill="#7C3AED" opacity="0.7"/>
  </g>

  <!-- 连线与箭头：先画线，再叠端口，保证落点清楚 -->
  <g id="connections" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 编码器记忆到 K / V 的同一主干 -->
    <path id="memory-trunk" d="M 1325 350 V 380 H 800" stroke="#0F766E" stroke-width="3.2"/>
    <path id="branch-k" d="M 800 380 C 760 380 705 389 705 418" stroke="#0891B2" stroke-width="3.1"/>
    <path id="branch-v" d="M 800 380 C 840 380 895 389 895 418" stroke="#7C3AED" stroke-width="3.1"/>

    <!-- 解码器状态到 Q -->
    <path id="query-arrow" d="M 410 565 H 563" stroke="#2563EB" stroke-width="3.1"/>

    <!-- 交叉注意力输出到上下文表示 -->
    <path id="output-arrow" d="M 1025 620 H 1158" stroke="#B45309" stroke-width="3.1"/>

    <!-- 显式箭头，避免不同软件丢失 SVG marker -->
    <g id="arrowheads" stroke="none">
      <path id="head-q" d="M 563 565 L 547 556.7 L 547 573.3 Z" fill="#2563EB"/>
      <path id="head-k" d="M 705 419 L 696.7 403 L 713.3 403 Z" fill="#0891B2"/>
      <path id="head-v" d="M 895 419 L 886.7 403 L 903.3 403 Z" fill="#7C3AED"/>
      <path id="head-out" d="M 1158 620 L 1142 611.7 L 1142 628.3 Z" fill="#B45309"/>
    </g>
  </g>

  <!-- 四个主要框 -->
  <g id="nodes" class="cn">
    <!-- 解码器状态 -->
    <g id="node-decoder" filter="url(#boxShadow)">
      <rect x="110" y="490" width="300" height="150" rx="24" fill="#F3F7FF" stroke="#CADBF7" stroke-width="1.5"/>
      <rect x="110" y="515" width="5" height="100" rx="2.5" fill="#2563EB" opacity="0.9"/>
      <text x="140" y="528" class="latin eyebrow" fill="#4169A8">DECODER STATE</text>
      <text x="140" y="568" class="box-title" fill="#13264C">解码器状态</text>
      <text x="140" y="598" class="box-sub" fill="#5E7193">当前解码步的隐状态</text>
      <g id="decoder-q-badge">
        <circle cx="378" cy="525" r="17" fill="#E4EEFF" stroke="#BFD4F6" stroke-width="1.5"/>
        <text x="378" y="531" text-anchor="middle" class="latin" font-size="14" font-weight="700" fill="#2563EB">Q</text>
      </g>
    </g>

    <!-- 编码器记忆 -->
    <g id="node-encoder" filter="url(#boxShadow)">
      <rect x="1170" y="200" width="310" height="150" rx="24" fill="#EFFAF7" stroke="#C2E8DF" stroke-width="1.5"/>
      <rect x="1170" y="225" width="5" height="100" rx="2.5" fill="#0F766E" opacity="0.9"/>
      <text x="1200" y="238" class="latin eyebrow" fill="#2A7C70">ENCODER MEMORY</text>
      <text x="1200" y="278" class="box-title" fill="#0B3F3F">编码器记忆</text>
      <text x="1200" y="308" class="box-sub" fill="#507A75">跨序列键值对的来源</text>
      <g id="encoder-kv-badge">
        <rect x="1400" y="257" width="52" height="27" rx="13.5" fill="#E3F6F1" stroke="#BFE5DC" stroke-width="1.2"/>
        <text x="1426" y="275" text-anchor="middle" class="latin" font-size="11" font-weight="700" letter-spacing="1" fill="#0F766E">K · V</text>
      </g>
    </g>

    <!-- 交叉注意力 -->
    <g id="node-attention" filter="url(#cardShadow)">
      <rect x="575" y="430" width="450" height="330" rx="30" fill="url(#cardFill)" stroke="#2C3D62" stroke-width="1.5"/>
      <path d="M 625 430 H 975" stroke="url(#cardEdge)" stroke-width="2" stroke-linecap="round"/>
      <text x="800" y="466" text-anchor="middle" class="latin module-kicker">CROSS-ATTENTION</text>
      <text x="800" y="508" text-anchor="middle" class="module-title">交叉注意力</text>
      <text x="800" y="538" text-anchor="middle" class="latin module-sub">QUERY · KEY · VALUE → CONTEXT</text>

      <g id="formula-chip">
        <rect x="660" y="558" width="280" height="72" rx="18" fill="#22314F" stroke="#35476D" stroke-width="1.2"/>
        <text x="800" y="603" text-anchor="middle" class="formula">softmax(QKᵀ) · V</text>
      </g>
      <text x="800" y="660" text-anchor="middle" class="module-note">跨序列权重 · 加权聚合</text>

      <path d="M 635 684 H 965" stroke="#2E3E60" stroke-width="1" opacity="0.9"/>
      <text x="800" y="713" text-anchor="middle" class="module-note">Q 来自解码器状态；K、V 来自编码器记忆</text>
    </g>

    <!-- 上下文表示 -->
    <g id="node-context" filter="url(#boxShadow)">
      <rect x="1170" y="545" width="310" height="150" rx="24" fill="#FFF8EB" stroke="#F0D8AF" stroke-width="1.5"/>
      <rect x="1170" y="570" width="5" height="100" rx="2.5" fill="#B45309" opacity="0.9"/>
      <text x="1200" y="583" class="latin eyebrow" fill="#A16207">CONTEXT VECTOR</text>
      <text x="1200" y="623" class="box-title" fill="#53350C">上下文表示</text>
      <text x="1200" y="653" class="box-sub" fill="#80623F">融合编码器信息的输出</text>
    </g>
  </g>

  <!-- 具名箭头标签 -->
  <g id="arrow-labels" class="cn">
    <!-- Q -->
    <g id="label-q">
      <rect x="463" y="526" width="86" height="28" rx="14" fill="#F4F8FF" stroke="#C7D9F8" stroke-width="1.2"/>
      <text x="506" y="545" text-anchor="middle" class="port-text" fill="#2563EB">Q 查询</text>
    </g>

    <!-- K / V 分支标签 -->
    <g id="label-k">
      <line x1="687" y1="406" x2="709" y2="406" stroke="#0891B2" stroke-width="1.5" opacity="0.65"/>
      <circle cx="672" cy="406" r="15" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
      <text x="672" y="411" text-anchor="middle" class="latin" font-size="14" font-weight="700" fill="#08748F">K</text>
    </g>
    <g id="label-v">
      <line x1="886.5" y1="406" x2="913" y2="406" stroke="#7C3AED" stroke-width="1.5" opacity="0.65"/>
      <circle cx="928" cy="406" r="15" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
      <text x="928" y="411" text-anchor="middle" class="latin" font-size="14" font-weight="700" fill="#6D28D9">V</text>
    </g>

    <!-- 主干说明 -->
    <text x="1100" y="365" text-anchor="middle" class="trunk-label">同一主干</text>

    <!-- 输出 -->
    <g id="label-output">
      <rect x="1058" y="582" width="70" height="27" rx="13.5" fill="#FFF8EC" stroke="#F0D8AF" stroke-width="1.2"/>
      <text x="1093" y="600" text-anchor="middle" class="port-text" fill="#A16207">输出</text>
    </g>
  </g>

  <!-- 端口落点 -->
  <g id="ports">
    <!-- 解码器状态出口 -->
    <g id="port-decoder-out">
      <circle cx="410" cy="565" r="10" fill="#F3F7FF" stroke="#2563EB" stroke-width="3"/>
      <circle cx="410" cy="565" r="3" fill="#2563EB"/>
    </g>

    <!-- Q 端口（交叉注意力左侧） -->
    <g id="port-q">
      <circle cx="575" cy="565" r="18" fill="#60A5FA" opacity="0.14"/>
      <circle cx="575" cy="565" r="11" fill="#0C1424" stroke="#60A5FA" stroke-width="3"/>
      <circle cx="575" cy="565" r="3.4" fill="#BFDBFE"/>
    </g>

    <!-- K / V 端口（交叉注意力顶部） -->
    <g id="port-k">
      <circle cx="705" cy="430" r="18" fill="#22D3EE" opacity="0.12"/>
      <circle cx="705" cy="430" r="11" fill="#0C1424" stroke="#22D3EE" stroke-width="3"/>
      <circle cx="705" cy="430" r="3.4" fill="#A5F3FC"/>
    </g>
    <g id="port-v">
      <circle cx="895" cy="430" r="18" fill="#C4B5FD" opacity="0.14"/>
      <circle cx="895" cy="430" r="11" fill="#0C1424" stroke="#C4B5FD" stroke-width="3"/>
      <circle cx="895" cy="430" r="3.4" fill="#DDD6FE"/>
    </g>

    <!-- 交叉注意力输出端口 -->
    <g id="port-out">
      <circle cx="1025" cy="620" r="18" fill="#FBBF24" opacity="0.12"/>
      <circle cx="1025" cy="620" r="11" fill="#0C1424" stroke="#FBBF24" stroke-width="3"/>
      <circle cx="1025" cy="620" r="3.4" fill="#FDE68A"/>
    </g>

    <!-- 上下文表示输入端口 -->
    <g id="port-context-in">
      <circle cx="1170" cy="620" r="10" fill="#FFF8EB" stroke="#B45309" stroke-width="3"/>
      <circle cx="1170" cy="620" r="3" fill="#B45309"/>
    </g>

    <!-- 编码器记忆出口 -->
    <g id="port-encoder-out">
      <circle cx="1325" cy="350" r="10" fill="#EFFAF7" stroke="#0F766E" stroke-width="3"/>
      <circle cx="1325" cy="350" r="3" fill="#0F766E"/>
    </g>

    <!-- 主干分叉节点 -->
    <g id="fork-node">
      <circle cx="800" cy="380" r="8" fill="#F7F8FC" stroke="#0F766E" stroke-width="2.5"/>
      <circle cx="800" cy="380" r="3.4" fill="#0F766E"/>
    </g>
  </g>

  <!-- 图注 -->
  <g id="caption" class="cn">
    <line x1="780" y1="797" x2="820" y2="797" stroke="#CBD4E3" stroke-width="1.5" stroke-linecap="round"/>
    <text x="800" y="826" text-anchor="middle" class="footer">Q 来自解码器状态；K、V 由编码器记忆的同一主干分叉得到。</text>
  </g>
</svg>
