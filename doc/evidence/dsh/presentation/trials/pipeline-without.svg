<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">数据质量检查：四步流程</title>
  <desc id="figDesc">从上到下依次为接收样本、校验字段与单位、缺失值与异常值检查、导出报告四个步骤。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF4F3"/>
    </linearGradient>
    <linearGradient id="titleRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#5FBDB1"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0B1B2B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Title block -->
  <g id="title">
    <rect x="206" y="52" width="6" height="116" rx="3" fill="url(#titleRule)"/>
    <text x="240" y="78" fill="#5E7385" font-family="Avenir Next, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3">DATA QUALITY CHECK</text>
    <text x="238" y="144" fill="#102A43" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="58" font-weight="700" letter-spacing="1">数据质量检查</text>
  </g>

  <!-- Step 1 -->
  <g id="step-1">
    <title>第 1 步：接收样本 / Ingest</title>
    <rect x="240" y="214" width="1120" height="112" rx="16" fill="#FFFFFF" stroke="#DCE5EC" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="276" y="241" width="4" height="58" rx="2" fill="#0F766E"/>
    <circle cx="330" cy="270" r="25" fill="#E8F4F1"/>
    <text x="330" y="276" text-anchor="middle" fill="#0B6B61" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="0.5">01</text>
    <text x="382" y="261" fill="#102A43" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="30" font-weight="600">接收样本</text>
    <text x="382" y="294" fill="#5E7385" font-family="Avenir Next, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="0.2">Ingest</text>
    <circle cx="1292" cy="270" r="25" fill="#F0F7F5"/>
    <g transform="translate(1292 270)" fill="none" stroke="#0F766E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -13V5M-7 -2L0 5L7 -2"/>
      <path d="M-13 6V13H13V6"/>
    </g>
  </g>

  <!-- Step 2 -->
  <g id="step-2">
    <title>第 2 步：校验字段与单位 / Schema validation</title>
    <rect x="240" y="370" width="1120" height="112" rx="16" fill="#FFFFFF" stroke="#DCE5EC" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="276" y="397" width="4" height="58" rx="2" fill="#0F766E"/>
    <circle cx="330" cy="426" r="25" fill="#E8F4F1"/>
    <text x="330" y="432" text-anchor="middle" fill="#0B6B61" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="0.5">02</text>
    <text x="382" y="417" fill="#102A43" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="30" font-weight="600">校验字段与单位</text>
    <text x="382" y="450" fill="#5E7385" font-family="Avenir Next, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="0.2">Schema validation</text>
    <circle cx="1292" cy="426" r="25" fill="#F0F7F5"/>
    <g transform="translate(1292 426)" fill="none" stroke="#0F766E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-13" y="-14" width="26" height="28" rx="4"/>
      <path d="M-7 -6L-4 -3L1 -9"/>
      <path d="M4 -5H7M-7 4H7M-7 9H3"/>
    </g>
  </g>

  <!-- Step 3 -->
  <g id="step-3">
    <title>第 3 步：缺失值与异常值检查 / Quality checks</title>
    <rect x="240" y="526" width="1120" height="112" rx="16" fill="#FFFFFF" stroke="#DCE5EC" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="276" y="553" width="4" height="58" rx="2" fill="#0F766E"/>
    <circle cx="330" cy="582" r="25" fill="#E8F4F1"/>
    <text x="330" y="588" text-anchor="middle" fill="#0B6B61" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="0.5">03</text>
    <text x="382" y="573" fill="#102A43" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="30" font-weight="600">缺失值与异常值检查</text>
    <text x="382" y="606" fill="#5E7385" font-family="Avenir Next, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="0.2">Quality checks</text>
    <circle cx="1292" cy="582" r="25" fill="#F0F7F5"/>
    <g transform="translate(1292 582)" fill="none" stroke="#0F766E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-3" cy="-4" r="9.5"/>
      <path d="M4 3L13 12"/>
      <path d="M-3 -8V-3"/>
      <circle cx="-3" cy="1.5" r="0.9" fill="#0F766E" stroke="none"/>
    </g>
  </g>

  <!-- Step 4 -->
  <g id="step-4">
    <title>第 4 步：导出报告 / Export</title>
    <rect x="240" y="682" width="1120" height="112" rx="16" fill="#FFFFFF" stroke="#DCE5EC" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="276" y="709" width="4" height="58" rx="2" fill="#0F766E"/>
    <circle cx="330" cy="738" r="25" fill="#E8F4F1"/>
    <text x="330" y="744" text-anchor="middle" fill="#0B6B61" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="0.5">04</text>
    <text x="382" y="729" fill="#102A43" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="30" font-weight="600">导出报告</text>
    <text x="382" y="762" fill="#5E7385" font-family="Avenir Next, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="0.2">Export</text>
    <circle cx="1292" cy="738" r="25" fill="#F0F7F5"/>
    <g transform="translate(1292 738)" fill="none" stroke="#0F766E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-11 -13H2L11 -4V13H-11Z"/>
      <path d="M2 -13V-4H11"/>
      <path d="M0 9V-4M-6 2L0 -4L6 2"/>
    </g>
  </g>

  <!-- Connectors -->
  <g id="connectors" fill="none" stroke="#0F766E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M800 333V348"/>
    <path d="M792 349L800 360L808 349"/>
    <path d="M800 489V504"/>
    <path d="M792 505L800 516L808 505"/>
    <path d="M800 645V660"/>
    <path d="M792 661L800 672L808 661"/>
  </g>
</svg>
