<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="900"
     viewBox="0 0 1600 900"
     role="img"
     aria-labelledby="figure-title figure-desc"
     font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif"
     shape-rendering="geometricPrecision"
     text-rendering="geometricPrecision">
  <title id="figure-title">稿件发布流程图</title>
  <desc id="figure-desc">收稿后同时进入事实核查和文字审校；事实核查到事实确认，文字审校到校样确认；事实确认与校样确认汇入终审，最后发表。</desc>

  <!-- 背景 -->
  <g id="background">
    <rect width="1600" height="900" fill="#F7F8F5"/>
  </g>

  <!-- 标题区 -->
  <g id="header">
    <rect x="80" y="57" width="4" height="118" rx="2" fill="#0F766E"/>
    <text x="100" y="75"
          font-size="12.5"
          font-weight="600"
          letter-spacing="2.2"
          fill="#3F7E76">EDITORIAL WORKFLOW</text>
    <text x="98" y="140"
          font-size="50"
          font-weight="700"
          letter-spacing="1.5"
          fill="#172B3A">稿件发布</text>
    <text x="100" y="180"
          font-size="17"
          font-weight="400"
          fill="#61707D">收稿后双线并行审校，两项确认汇入终审，定稿发表</text>

    <g id="header-badge">
      <rect x="1290" y="58" width="230" height="38" rx="19"
            fill="#EEF5F1" stroke="#D7E4DE" stroke-width="1"/>
      <circle cx="1314" cy="77" r="4" fill="#0F766E"/>
      <circle cx="1327" cy="77" r="4" fill="#B26A1B"/>
      <text x="1343" y="82"
            font-size="13"
            font-weight="500"
            fill="#3B5D52">双线并行 · 双项确认</text>
    </g>

    <line x1="80" y1="216" x2="1520" y2="216" stroke="#DEE4E5" stroke-width="1"/>
    <line x1="80" y1="216" x2="188" y2="216" stroke="#0F766E" stroke-width="2.5"/>
  </g>

  <!-- 流程连线：均为正交路径，双线互不交叉 -->
  <g id="flow-connectors"
     fill="none"
     stroke="#526575"
     stroke-width="2.2"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path id="connector-trunk" d="M280 462 H340"/>

    <path id="connector-split-fact"
          d="M340 462 V338 Q340 328 350 328 H415"/>
    <path id="connector-split-copy"
          d="M340 462 V586 Q340 596 350 596 H415"/>

    <path id="connector-fact-check"
          d="M645 328 H755"/>
    <path id="connector-copy-check"
          d="M645 596 H755"/>

    <path id="connector-fact-merge"
          d="M965 328 H1000 Q1012 328 1012 340 V451"/>
    <path id="connector-copy-merge"
          d="M965 596 H1000 Q1012 596 1012 584 V473"/>

    <path id="connector-merge-final"
          d="M1018.5 462 H1060"/>
    <path id="connector-final-publish"
          d="M1270 462 H1320"/>
  </g>

  <!-- 实心箭头：使用独立图元，确保各 SVG 查看器一致显示 -->
  <g id="arrowheads" fill="#526575" stroke="none">
    <path d="M415 328 L403 322.5 L405.8 328 L403 333.5 Z"/>
    <path d="M415 596 L403 590.5 L405.8 596 L403 601.5 Z"/>
    <path d="M755 328 L743 322.5 L745.8 328 L743 333.5 Z"/>
    <path d="M755 596 L743 590.5 L745.8 596 L743 601.5 Z"/>
    <path d="M1060 462 L1048 456.5 L1050.8 462 L1048 467.5 Z"/>
    <path d="M1320 462 L1308 456.5 L1310.8 462 L1308 467.5 Z"/>
    <path d="M1012 451 L1006.5 439 L1012 441.8 L1017.5 439 Z"/>
    <path d="M1012 473 L1006.5 485 L1012 482.2 L1017.5 485 Z"/>
    <path d="M1404 781 L1392 775.5 L1394.8 781 L1392 786.5 Z"/>
  </g>

  <g id="merge-junction">
    <circle cx="1012" cy="462" r="6.5"
            fill="#526575" stroke="#F7F8F5" stroke-width="3.5"/>
  </g>

  <!-- 流程节点 -->
  <g id="nodes">

    <!-- 收稿 -->
    <g id="node-receipt" data-role="start">
      <rect x="110" y="409" width="170" height="116" rx="18"
            fill="#172B3A" opacity="0.07"/>
      <rect x="110" y="404" width="170" height="116" rx="18"
            fill="#182F40"/>
      <g transform="translate(183 430)"
         fill="none" stroke="#EAF3F2" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.2 5.2 H19.8 V18.8 H4.2 Z"/>
        <path d="M4.2 13.4 H8.3 L10 16.1 H14.1 L15.8 13.4 H19.8"/>
        <path d="M8.8 9.1 H15.2"/>
      </g>
      <text x="195" y="496"
            text-anchor="middle"
            font-size="26"
            font-weight="600"
            fill="#FFFFFF">收稿</text>
    </g>

    <!-- 事实核查 -->
    <g id="node-fact-check" data-lane="fact">
      <rect x="415" y="277" width="230" height="112" rx="18"
            fill="#172B3A" opacity="0.045"/>
      <rect x="415" y="272" width="230" height="112" rx="18"
            fill="#FFFFFF" stroke="#CCE2DC" stroke-width="1.2"/>
      <rect x="435" y="307" width="42" height="42" rx="12" fill="#E7F3EF"/>
      <g transform="translate(444 316)"
         fill="none" stroke="#0F766E" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10.2" cy="10.2" r="6.4"/>
        <path d="M15 15 L19.8 19.8"/>
        <path d="M7.3 10.4 L9.3 12.4 L13.1 8.2"/>
      </g>
      <text x="495" y="323"
            font-size="23"
            font-weight="600"
            fill="#1D2C3A">事实核查</text>
      <text x="495" y="349"
            font-size="13"
            font-weight="400"
            fill="#6A7783">核查关键信息</text>
    </g>

    <!-- 事实确认 -->
    <g id="node-fact-confirm" data-lane="fact">
      <rect x="755" y="277" width="210" height="112" rx="18"
            fill="#172B3A" opacity="0.045"/>
      <rect x="755" y="272" width="210" height="112" rx="18"
            fill="#FFFFFF" stroke="#CCE2DC" stroke-width="1.2"/>
      <rect x="775" y="307" width="42" height="42" rx="12" fill="#E7F3EF"/>
      <g transform="translate(784 316)"
         fill="none" stroke="#0F766E" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.8 L19 5.5 V10.7 C19 15 16.2 18.4 12 20.1 C7.8 18.4 5 15 5 10.7 V5.5 Z"/>
        <path d="M8.4 11.8 L10.8 14.2 L15.6 9.2"/>
      </g>
      <text x="835" y="323"
            font-size="23"
            font-weight="600"
            fill="#1D2C3A">事实确认</text>
      <text x="835" y="349"
            font-size="13"
            font-weight="400"
            fill="#6A7783">形成核查结论</text>
    </g>

    <!-- 文字审校 -->
    <g id="node-copyedit" data-lane="copy">
      <rect x="415" y="545" width="230" height="112" rx="18"
            fill="#172B3A" opacity="0.045"/>
      <rect x="415" y="540" width="230" height="112" rx="18"
            fill="#FFFFFF" stroke="#E9D7C2" stroke-width="1.2"/>
      <rect x="435" y="575" width="42" height="42" rx="12" fill="#FAF0E3"/>
      <g transform="translate(444 584)"
         fill="none" stroke="#A6611E" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.4 19.6 L5.4 15.2 L15.8 4.8 C16.6 4 17.8 4 18.6 4.8 L19.2 5.4 C20 6.2 20 7.4 19.2 8.2 L8.8 18.6 Z"/>
        <path d="M13.9 6.7 L17.3 10.1"/>
        <path d="M4.4 19.6 L8.8 18.6"/>
      </g>
      <text x="495" y="591"
            font-size="23"
            font-weight="600"
            fill="#1D2C3A">文字审校</text>
      <text x="495" y="617"
            font-size="13"
            font-weight="400"
            fill="#6A7783">统一文字体例</text>
    </g>

    <!-- 校样确认 -->
    <g id="node-proof-confirm" data-lane="copy">
      <rect x="755" y="545" width="210" height="112" rx="18"
            fill="#172B3A" opacity="0.045"/>
      <rect x="755" y="540" width="210" height="112" rx="18"
            fill="#FFFFFF" stroke="#E9D7C2" stroke-width="1.2"/>
      <rect x="775" y="575" width="42" height="42" rx="12" fill="#FAF0E3"/>
      <g transform="translate(784 584)"
         fill="none" stroke="#A6611E" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M5.5 2.8 H14.2 L19 7.6 V21.2 H5.5 Z"/>
        <path d="M14 2.8 V7.8 H19"/>
        <path d="M8.9 14.4 L11.1 16.6 L15.2 12.1"/>
      </g>
      <text x="835" y="591"
            font-size="23"
            font-weight="600"
            fill="#1D2C3A">校样确认</text>
      <text x="835" y="617"
            font-size="13"
            font-weight="400"
            fill="#6A7783">锁定最终校样</text>
    </g>

    <!-- 终审 -->
    <g id="node-final-review" data-role="gate">
      <rect x="1060" y="405" width="210" height="124" rx="20"
            fill="#172B3A" opacity="0.05"/>
      <rect x="1060" y="400" width="210" height="124" rx="20"
            fill="#F0F4F8" stroke="#C4D2DF" stroke-width="1.4"/>
      <rect x="1080" y="441" width="42" height="42" rx="12" fill="#DDE8F1"/>
      <g transform="translate(1089 450)"
         fill="none" stroke="#243E5A" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3.5 H15 V8.3 C15 9.5 15.7 10.5 16.7 11 L17.9 11.6 C18.6 12 19 12.7 19 13.5 V15.5 H5 V13.5 C5 12.7 5.4 12 6.1 11.6 L7.3 11 C8.3 10.5 9 9.5 9 8.3 Z"/>
        <path d="M4.2 18.3 H19.8"/>
      </g>
      <text x="1140" y="458"
            font-size="24"
            font-weight="600"
            fill="#1D2C3A">终审</text>
      <text x="1140" y="484"
            font-size="13"
            font-weight="400"
            fill="#6A7783">汇合双线确认</text>
    </g>

    <!-- 发表 -->
    <g id="node-publish" data-role="end">
      <rect x="1320" y="409" width="180" height="116" rx="18"
            fill="#172B3A" opacity="0.07"/>
      <rect x="1320" y="404" width="180" height="116" rx="18"
            fill="#1F5C4A"/>
      <g transform="translate(1398 430)"
         fill="none" stroke="#FFFFFF" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.4 11.4 L20.4 3.9 L14 20.4 L11.2 13.4 Z"/>
        <path d="M11.2 13.4 L20.4 3.9"/>
      </g>
      <text x="1410" y="496"
            text-anchor="middle"
            font-size="26"
            font-weight="600"
            fill="#FFFFFF">发表</text>
    </g>

  </g>

  <!-- 页脚说明 -->
  <g id="footer">
    <line x1="80" y1="746" x2="1520" y2="746" stroke="#DFE5E6" stroke-width="1"/>
    <line x1="80" y1="769" x2="80" y2="790" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
    <text x="96" y="786"
          font-size="13.5"
          font-weight="400"
          fill="#6F7C86">两条审校线独立推进、互不交叉；分别确认后统一汇入终审。</text>

    <g id="direction-legend">
      <line x1="1370" y1="781" x2="1404" y2="781"
            stroke="#526575" stroke-width="2.2" stroke-linecap="round"
            />
      <text x="1416" y="786"
            font-size="12.5"
            font-weight="400"
            fill="#7E8A93">流程方向</text>
    </g>
  </g>
</svg>
