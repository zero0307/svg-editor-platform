name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check format, documents, build, tests and architecture
        run: npm run check
      - name: Verify SVG rendering
        run: npm run verify:visual

  required:
    name: CI required
    if: ${{ always() }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix check to succeed
        env:
          MATRIX_RESULT: ${{ needs.check.result }}
        run: test "$MATRIX_RESULT" = success

  release-dsh:
    name: Publish the DSH release archive
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Look for a newly merged market version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          manifest=apps/dsh-plugin/package.json
          if [[ -f "$manifest" && -d apps/dsh-plugin/market ]]; then
            current=$(jq -er .version "$manifest")
            previous=$(git show "$BEFORE:$manifest" 2>/dev/null | jq -r .version) || previous=""
            if [[ "$current" == "0.14.2" && "$current" != "$previous" ]]; then
              echo "publish=$current" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v7.1.0
        if: steps.version.outputs.publish
        with:
          node-version: 24
          cache: npm
      - name: Build the market archive
        if: steps.version.outputs.publish
        run: |
          npm ci
          npm pack --workspace dsh-svg-editor --pack-destination "$RUNNER_TEMP"
      - name: Publish the archive and SHA-256
        if: steps.version.outputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.publish }}
        run: bash ci/publish-dsh.sh "$RUNNER_TEMP/dsh-svg-editor-$VERSION.tgz"
      - name: Verify public release assets
        if: steps.version.outputs.publish
        env:
          VERSION: ${{ steps.version.outputs.publish }}
        run: |
          dir="$RUNNER_TEMP/public"
          mkdir "$dir"
          name="dsh-svg-editor-$VERSION.tgz"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/dsh-svg-editor-v$VERSION"
          for file in "$name" "$name.sha256"; do
            curl --retry 4 --retry-all-errors --fail --location --silent --show-error "$base/$file" --output "$dir/$file"
          done
          (cd "$dir" && sha256sum --check "$name.sha256")
          cmp "$RUNNER_TEMP/$name" "$dir/$name"
