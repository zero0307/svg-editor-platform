name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check format, documents, build, tests and architecture
        run: npm run check
      - name: Verify SVG rendering
        run: npm run verify:visual

  required:
    name: CI required
    if: ${{ always() }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix check to succeed
        env:
          MATRIX_RESULT: ${{ needs.check.result }}
        run: test "$MATRIX_RESULT" = success
