name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check format, documents, build, tests and architecture
        run: npm run check
      - name: Ensure a Chinese font is available for pixel checks
        if: runner.os == 'Linux'
        run: |
          if [ -z "$(fc-list :lang=zh family)" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
      - name: Verify SVG rendering
        run: npm run verify:visual
      - name: Install and verify the DSH plugin in a fresh profile
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        shell: bash
        run: |
          runtime="$RUNNER_TEMP/svg-dsh"
          npm install --prefix "$runtime" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.5 pnpm@10.32.1
          export PATH="$runtime/node_modules/.bin:$PATH"
          export DSH_CLI="$runtime/node_modules/@deepseek-ai/dsh/lib/bin.js"
          npm run verify:dsh
          npm run demo:dsh -- --input apps/dsh-plugin/demo/transformer-qkv.json
          node apps/dsh-plugin/verification/transformer-bench.mjs --export-layers 24 --style arc > "$RUNNER_TEMP/transformer-24.json"
          npm run demo:dsh -- --input "$RUNNER_TEMP/transformer-24.json"

  required:
    name: CI required
    if: ${{ always() }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix check to succeed
        env:
          MATRIX_RESULT: ${{ needs.check.result }}
        run: test "$MATRIX_RESULT" = success

  release-dsh:
    name: Publish and reinstall the DSH market archive
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Look for a newly merged market version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          manifest=apps/dsh-plugin/package.json
          if [[ -f "$manifest" && -d apps/dsh-plugin/market ]]; then
            current=$(jq -er .version "$manifest")
            previous=$(git show "$BEFORE:$manifest" 2>/dev/null | jq -r .version) || previous=""
            if [[ "$current" == "0.14.2" && "$current" != "$previous" ]]; then
              echo "publish=$current" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v7.1.0
        if: steps.version.outputs.publish
        with:
          node-version: 24
          cache: npm
      - name: Build and install the archive in a fresh Harness profile
        if: steps.version.outputs.publish
        run: |
          npm ci
          runtime="$RUNNER_TEMP/dsh-release-runtime"
          npm install --prefix "$runtime" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.5 pnpm@10.32.1
          echo "$runtime/node_modules/.bin" >> "$GITHUB_PATH"
          echo "DSH_CLI=$runtime/node_modules/@deepseek-ai/dsh/lib/bin.js" >> "$GITHUB_ENV"
          export PATH="$runtime/node_modules/.bin:$PATH"
          npm run demo:dsh -- --evidence "$RUNNER_TEMP/verified"
      - name: Publish the verified archive and SHA-256
        if: steps.version.outputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.publish }}
        run: bash ci/publish-dsh.sh "$RUNNER_TEMP/verified/dsh-svg-editor-$VERSION.tgz"
      - name: Reinstall from the public market URL
        if: steps.version.outputs.publish
        env:
          VERSION: ${{ steps.version.outputs.publish }}
        run: |
          dir="$RUNNER_TEMP/public"
          mkdir "$dir"
          name="dsh-svg-editor-$VERSION.tgz"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/dsh-svg-editor-v$VERSION"
          for file in "$name" "$name.sha256"; do
            curl --retry 4 --retry-all-errors --fail --location --silent --show-error "$base/$file" --output "$dir/$file"
          done
          (cd "$dir" && sha256sum --check "$name.sha256")
          cmp "$RUNNER_TEMP/verified/$name" "$dir/$name"
          npm run verify:dsh -- --archive "$dir/$name"
